<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financeiro · Ganhos</title><style>:root{--w:#fff;--b:#d7e4de;--s:#f5f8f6;--t:#18372e;--m:#71897f;--g:#17624d;--r:14px;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;padding:28px;background:#f3f7f4;color:var(--t)}.fv2-module{background:var(--w);border:1px solid var(--b);border-radius:var(--r);overflow:hidden;box-shadow:0 8px 28px #173c2e0d}.fv2-heading{display:flex;justify-content:space-between;gap:18px;padding:22px 24px 18px;border-bottom:1px solid var(--b)}.fv2-heading span{font-size:11px;letter-spacing:.12em;font-weight:800;color:var(--g)}h2{font-size:26px;margin:5px 0}p{color:var(--m);margin:0;font-size:14px}.fv2-button{border:1px solid var(--b);min-height:38px;border-radius:8px;padding:8px 12px;background:#fff;color:#103d30;font-weight:700;cursor:pointer}.primary{background:var(--g);color:#fff;border-color:var(--g)}.fv2-tabs{display:flex;padding:14px 24px 0;border-bottom:1px solid var(--b)}.fv2-tab{border:0;border-bottom:3px solid transparent;background:none;padding:10px 14px;margin-bottom:-1px;color:var(--m);font-weight:700;cursor:pointer}.fv2-tab.active{color:var(--g);border-color:var(--g)}.filters{display:flex;gap:12px;flex-wrap:wrap;padding:18px 24px;background:var(--s);border-bottom:1px solid var(--b)}label{display:grid;gap:5px;font-size:12px;font-weight:700;color:#4e6c61}input,select{height:40px;min-width:180px;padding:8px;border:1px solid #b8ccc2;border-radius:8px;background:#fff}.filters label:first-child{flex:1}.filters label:first-child input{width:100%}.table-head{padding:18px 24px 13px;display:flex;justify-content:space-between}.table-head h3{margin:0;font-size:16px}.scroll{overflow:auto;margin:0 24px 24px;border:1px solid var(--b);border-radius:11px}table{width:100%;min-width:780px;border-collapse:collapse;font-size:13px}th{padding:12px 11px;background:var(--s);font-size:11px;color:var(--m);text-align:left;text-transform:uppercase}td{padding:13px 11px;border-top:1px solid #e8f0ec}.chip{display:inline-block;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700;background:#eaf5ef;color:#17624d}.booking{background:#eee9fb;color:#6253a0}.sale{background:#fff4df;color:#99590c}.money{text-align:right;color:#16724e;font-weight:800}.edit{border:0;background:none;color:var(--g);text-decoration:underline;font-weight:700;cursor:pointer}@media(max-width:700px){body{padding:12px}.fv2-heading{padding:16px;flex-direction:column}.filters{padding:14px}.scroll{margin:0 12px 16px}}</style></head><body><main class="fv2-module"><header class="fv2-heading"><div><span>FINANCEIRO</span><h2 id="title">Ganhos</h2><p id="hint">Recebimentos de reservas e vendas avulsas, separados pela origem.</p></div><button class="fv2-button primary" id="add" hidden>+ Registrar venda</button></header><nav class="fv2-tabs"><button class="fv2-tab active" data-tab="reservas">Recebimentos de reservas</button><button class="fv2-tab" data-tab="vendas">Vendas</button></nav><div class="filters"><label>Buscar<input id="q" placeholder="Descrição ou conta"></label><label>Conta<select><option>Todas as contas</option><option>Banco Inter</option><option>Caixa</option></select></label><button class="fv2-button" id="clear">Limpar filtros</button></div><div class="table-head"><div><h3>Tabela geral</h3><p id="count"></p></div><button class="fv2-button" id="csv">Exportar CSV</button></div><div class="scroll"><table><thead><tr><th>Data</th><th>Descrição</th><th>Origem</th><th>Conta / forma</th><th class="money">Entrada</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div></main><dialog id="modal"><form method="dialog"><h2>Registrar venda</h2><p>Este lançamento mock fica separado das reservas.</p><label>Data<input name="date" type="date" value="2026-11-05"></label><label>Descrição<input name="desc" required placeholder="Ex.: Consumo no bar"></label><label>Valor<input name="value" type="number" min=".01" step=".01" required></label><menu><button class="fv2-button">Cancelar</button><button class="fv2-button primary" value="save">Salvar mock</button></menu></form></dialog><script>let tab='reservas',sales=[['2026-11-04','Venda de bebidas',96,'Caixa','Dinheiro'],['2026-11-06','Café da manhã extra',72,'Pix','Pix']],res=[['2026-11-03','Reserva — Helena e família',1280,'Banco Inter','Cartão','Direta'],['2026-11-05','Booking — Studio Serra',846.5,'Banco Inter','Transferência','Booking']];const money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function render(){let a=(tab==='vendas'?sales:res).filter(x=>x.join(' ').toLowerCase().includes(q.value.toLowerCase()));title.textContent=tab==='vendas'?'Vendas':'Ganhos';hint.textContent=tab==='vendas'?'Registre vendas avulsas sem misturá-las aos recebimentos das reservas.':'Entradas registradas, incluindo recebimentos de reservas.';add.hidden=tab!=='vendas';rows.innerHTML=a.map((r,i)=>`<tr><td>${r[0].split('-').reverse().join('/')}</td><td><b>${r[1]}</b></td><td><span class="chip ${tab==='vendas'?'sale':r[5]==='Booking'?'booking':''}">${tab==='vendas'?'Venda avulsa':r[5]}</span></td><td>${r[3]}<small> · ${r[4]}</small></td><td class="money">${money(r[2])}</td><td>${tab==='vendas'?`<button class="edit" onclick="edit(${i})">Editar</button>`:'<span class="edit">Abrir reserva</span>'}</td></tr>`).join('');count.textContent=`${a.length} lançamentos`};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});q.oninput=render;clear.onclick=()=>{q.value='';render()};add.onclick=()=>modal.showModal();modal.addEventListener('close',()=>{if(modal.returnValue==='save'){let f=new FormData(modal.querySelector('form'));sales.push([f.get('date'),f.get('desc'),Number(f.get('value')),'Caixa','Pix']);render()}});function edit(i){let v=prompt('Novo valor',sales[i][2]);if(v){sales[i][2]=Number(v);render()}};csv.onclick=()=>alert('Mock: o CSV exportaria somente as linhas filtradas.');render();</script></body></html>
