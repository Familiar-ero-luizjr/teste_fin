<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ganhos · Enjoy Gestão V2</title><style>
/* Tokens visuais do Enjoy Gestão. Fonte: design system do baseline, preservado sem lógica de negócio. */
:root {
  color-scheme: light;

  /* Typography */
  --font-family-sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-size-xs: 12px;
  --font-size-sm: 13px;
  --font-size-base: 14px;
  --font-size-md: 15px;
  --font-size-lg: 16px;
  --font-size-xl: 18px;
  --font-size-2xl: 20px;
  --font-size-3xl: 22px;
  --font-size-4xl: 27px;
  --line-height-tight: 1.2;
  --line-height-snug: 1.35;
  --line-height-body: 1.5;
  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --font-weight-strong: 800;

  /* Spacing — 2px base, 4px rhythm */
  --space-0: 0;
  --space-0-5: 2px;
  --space-1: 4px;
  --space-1-5: 6px;
  --space-2: 8px;
  --space-2-5: 10px;
  --space-3: 12px;
  --space-3-5: 14px;
  --space-4: 16px;
  --space-4-5: 18px;
  --space-5: 20px;
  --space-6: 24px;
  --space-7: 28px;
  --space-8: 32px;
  --space-9: 36px;
  --space-10: 40px;
  --space-12: 48px;
  --space-14: 56px;
  --space-16: 64px;

  /* Radius */
  --radius-xs: 6px;
  --radius-sm: 8px;
  --radius-md: 10px;
  --radius-lg: 12px;
  --radius-xl: 14px;
  --radius-2xl: 16px;
  --radius-3xl: 24px;
  --radius-pill: 999px;

  /* Control density */
  --control-height-compact: 34px;
  --control-height-sm: 36px;
  --control-height-md: 40px;
  --control-height-lg: 46px;
  --touch-target-min: 44px;

  /* Neutral / surface */
  --color-white: #ffffff;
  --color-canvas: #f4f5f3;
  --color-surface-subtle: #fbfcfb;
  --color-surface-hover: #f8faf9;
  --color-surface-active: #f6f8f7;
  --color-border-soft: #edf0ee;
  --color-border: #e2e6e3;
  --color-border-strong: #ccd7d2;
  --color-text-strong: #15251f;
  --color-text: #1e2825;
  --color-text-secondary: #53605c;
  --color-text-muted: #71817b;
  --color-text-faint: #8b9591;

  /* Brand */
  --color-brand-900: #183d2e;
  --color-brand-800: #1f4a43;
  --color-brand-700: #285e54;
  --color-brand-600: #36705d;
  --color-brand-500: #78a294;
  --color-brand-300: #9fc2b8;
  --color-brand-200: #d8e7e2;
  --color-brand-100: #eaf2ef;
  --color-brand-50: #f4f8f6;

  /* Semantic states */
  --color-success-700: #247153;
  --color-success-600: #2f8a66;
  --color-success-100: #eaf6f0;
  --color-danger-700: #a34f49;
  --color-danger-600: #c75c52;
  --color-danger-200: #efd0cd;
  --color-danger-100: #faeeec;
  --color-danger-50: #fff9f8;
  --color-warning-800: #5b4b11;
  --color-warning-700: #946d28;
  --color-warning-500: #c7924c;
  --color-warning-300: #e8cf72;
  --color-warning-200: #ead9bd;
  --color-warning-100: #fff6e3;
  --color-warning-50: #fffdf8;
  --color-info-700: #5b6d7d;
  --color-info-100: #eef2f6;
  --color-accent-700: #765b86;
  --color-accent-100: #f3eef7;

  /* RGB channels used for translucency without recreating colors per module */
  --rgb-brand: 40 94 84;
  --rgb-brand-strong: 24 61 46;
  --rgb-success: 36 113 83;
  --rgb-shadow: 31 44 39;
  --rgb-overlay: 20 34 29;
  --rgb-canvas: 244 245 243;

  /* Shadows */
  --shadow-none: none;
  --shadow-xs: 0 1px 3px rgb(var(--rgb-shadow) / 0.12);
  --shadow-sm: 0 2px 6px rgb(var(--rgb-shadow) / 0.08);
  --shadow-card: 0 8px 28px rgb(var(--rgb-shadow) / 0.05);
  --shadow-popover: 0 10px 30px rgb(var(--rgb-shadow) / 0.15);
  --shadow-float: 0 5px 16px rgb(var(--rgb-shadow) / 0.14);
  --shadow-dialog: 0 24px 70px rgb(var(--rgb-overlay) / 0.24);
  --shadow-sidebar: 2px 0 8px -5px rgb(var(--rgb-shadow) / 0.18);
  --shadow-sidebar-mobile: 8px 0 24px rgb(var(--rgb-shadow) / 0.14);

  /* Interaction */
  --focus-border: var(--color-brand-500);
  --focus-ring: 0 0 0 3px rgb(var(--rgb-brand) / 0.10);
  --transition-fast: 140ms ease;
  --transition-base: 180ms ease;
  --transition-slow: 250ms ease;

  /* Layout */
  --content-max-width: 1450px;
  --sidebar-width: 256px;
  --sidebar-width-collapsed: 80px;
  --topbar-height: 76px;
  --sidebar-brand-height: 80px;

  /* Compatibility aliases: existing modules can migrate incrementally. */
  --bg: var(--color-canvas);
  --panel: var(--color-white);
  --ink: var(--color-text);
  --muted: var(--color-text-muted);
  --line: var(--color-border);
  --brand: var(--color-brand-700);
  --brand2: var(--color-brand-800);
  --brand-dark: var(--color-brand-900);
  --soft: var(--color-brand-100);
  --good: var(--color-success-700);
  --bad: var(--color-danger-700);
  --warn: var(--color-warning-700);
  --goodbg: var(--color-success-100);
  --badbg: var(--color-danger-100);
  --warnbg: var(--color-warning-100);
  --r: var(--radius-xl);
  --shadow: var(--shadow-card);
}


/* Painel financeiro: superfícies, filtros, tabela e formulários do módulo Financeiro. */
.fv2-module{background:var(--color-white);border:1px solid var(--color-border);border-radius:var(--radius-xl);box-shadow:var(--shadow-card);overflow:hidden;color:var(--color-text)}
.fv2-heading{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 24px 18px;border-bottom:1px solid var(--color-border-soft)}
.fv2-heading h2{font-size:var(--font-size-2xl);line-height:1.2;margin:5px 0}
.fv2-heading p{color:var(--color-text-muted);margin:0;font-size:var(--font-size-sm)}
.fv2-heading>div>span{font-size:11px;letter-spacing:.12em;font-weight:800;color:var(--color-brand-700)}
.fv2-heading-actions{display:flex;gap:10px;flex-wrap:wrap}
.fv2-tabs{display:flex;gap:0;padding:14px 24px 0;border-bottom:1px solid var(--color-border);background:var(--color-white)}
.fv2-tab{appearance:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:10px 14px;background:transparent;color:var(--color-text-muted);font:inherit;font-size:13px;font-weight:700;cursor:pointer}.fv2-tab:hover{color:var(--color-brand-800)}.fv2-tab.is-active{border-bottom-color:var(--color-brand-700);color:var(--color-brand-900)}
.fv2-button{border:1px solid var(--color-border);min-height:38px;border-radius:var(--radius-md);padding:8px 12px;font-size:var(--font-size-sm);font-weight:700;background:var(--color-white);color:var(--color-brand-900)}
.fv2-button.primary{background:var(--color-brand-700);color:#fff;border-color:var(--color-brand-700)}
.fv2-button:hover{filter:brightness(.97)}
.fv2-filters{display:flex;align-items:end;flex-wrap:wrap;gap:12px;padding:18px 24px;background:var(--color-surface-subtle);border-bottom:1px solid var(--color-border)}
.fv2-filters label{display:grid;gap:6px;font-weight:700;font-size:12px;color:var(--color-text-secondary)}
.fv2-filters select,.fv2-filters input{height:40px;min-width:155px;max-width:260px;padding:8px 12px;border:1px solid var(--color-border-strong);border-radius:var(--radius-md);background:#fff;color:var(--color-text-strong);font-weight:400;font-size:14px}
.fv2-filters .fv2-search{flex:1;min-width:170px}.fv2-filters .fv2-search input{width:100%;max-width:none}
.fv2-table-heading{padding:18px 24px 13px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.fv2-table-heading h3{margin:0;font-size:var(--font-size-lg);color:var(--color-text-strong)}.fv2-table-heading p{margin:3px 0 0;color:var(--color-text-muted);font-size:var(--font-size-xs)}
.fv2-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--color-border)}
.fv2-cards article{display:grid;gap:8px;padding:17px 20px;border-right:1px solid var(--color-border-soft);background:var(--color-surface-subtle)}.fv2-cards article:last-child{border-right:0}
.fv2-cards small{font-size:12px;color:var(--color-text-muted)}.fv2-cards strong{font-size:21px;color:var(--color-text-strong);font-weight:800}.fv2-cards span{font-size:11px;color:var(--color-text-faint)}
.fv2-in{color:var(--color-success-700)!important}.fv2-out{color:var(--color-danger-700)!important}
.fv2-scroll{overflow:auto;margin:0 24px 24px;border:1px solid var(--color-border);border-radius:var(--radius-lg)}
.fv2-table{width:100%;min-width:1160px;border-collapse:collapse;font-size:13px}
.fv2-table th{background:var(--color-surface-subtle);color:var(--color-text-muted);font-size:11px;letter-spacing:.055em;text-transform:uppercase;padding:12px 11px;white-space:nowrap;text-align:left}
.fv2-table td{padding:13px 11px;border-top:1px solid var(--color-border-soft);vertical-align:middle}
.fv2-table td small{display:block;margin-top:4px;color:var(--color-text-faint);font-size:11px}
.fv2-table td:first-child{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}.fv2-description{min-width:225px;max-width:350px}.fv2-description strong{font-weight:700;color:var(--color-text-strong)}
.fv2-chip{display:inline-block;border:1px solid var(--color-border);background:var(--color-brand-50);padding:3px 8px;border-radius:99px;color:var(--color-brand-900);font-size:12px}
.fv2-flow{display:inline-block;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700}.fv2-flow.in{background:var(--color-success-100);color:var(--color-success-700)}.fv2-flow.out{background:var(--color-danger-100);color:var(--color-danger-700)}
.fv2-money{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}.fv2-money.in{color:var(--color-success-700)}.fv2-money.out{color:var(--color-danger-700)}
.fv2-table tfoot th,.fv2-table tfoot td{font-weight:800;background:var(--color-surface-subtle);border-top:1px solid var(--color-border)}
.fv2-sort,.fv2-text-button{border:0;background:transparent;color:var(--color-brand-700);font-weight:700;padding:4px 0}.fv2-text-button{text-decoration:underline;text-underline-offset:3px;white-space:nowrap;font-size:12px}
.fv2-empty{text-align:center;padding:28px!important;color:var(--color-text-muted)}
.fv2-muted{color:var(--color-text-faint)}
.fv2-dialog{border:0;border-radius:var(--radius-xl);padding:0;width:min(600px,calc(100vw - 26px));max-height:92vh;box-shadow:0 20px 65px #0003;color:var(--color-text);overflow:auto}
.fv2-dialog::backdrop{background:#12261c95}.fv2-dialog-form header{padding:20px 24px;border-bottom:1px solid var(--color-border)}.fv2-dialog-form header h2{margin:0 0 6px;font-size:20px}.fv2-dialog-form header p{color:var(--color-text-muted);font-size:13px;margin:0}
.fv2-fields{padding:20px 24px;display:grid;grid-template-columns:1fr 1fr;gap:15px}.fv2-fields label{display:grid;gap:6px;font-size:12px;font-weight:700;color:var(--color-text-secondary)}
.fv2-fields input,.fv2-fields select{width:100%;min-width:0;min-height:40px;padding:8px 10px;background:#fff;border:1px solid var(--color-border-strong);border-radius:var(--radius-md);color:var(--color-text)}
.fv2-dialog-form footer{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--color-border)}
.fv2-form-error{margin:0 24px 14px;color:var(--color-danger-700);font-weight:700;font-size:13px}
.fv2-dialog [data-fv2-new-category]{display:grid;grid-template-columns:1fr 1fr;gap:15px;grid-column:1/-1}.fv2-dialog .fv2-fields small{font-weight:400;color:var(--color-text-muted)}
@media(max-width:1000px){.fv2-cards{grid-template-columns:repeat(2,1fr)}.fv2-cards article:nth-child(2){border-right:0}.fv2-cards article:nth-child(-n+2){border-bottom:1px solid var(--color-border)}}
@media(max-width:700px){.fv2-heading{align-items:flex-start;padding:16px;flex-direction:column}.fv2-tabs{padding:10px 16px 0;overflow:auto}.fv2-tab{white-space:nowrap;padding:10px 11px}.fv2-filters{padding:14px 16px}.fv2-filters label{flex:1;min-width:145px}.fv2-filters select,.fv2-filters input{width:100%;max-width:none;min-width:0}.fv2-scroll{margin:0 12px 16px}.fv2-table-heading{padding:16px 12px}.fv2-cards{grid-template-columns:1fr 1fr}.fv2-cards article{padding:12px}.fv2-cards strong{font-size:16px}.fv2-fields{grid-template-columns:1fr;padding:15px}.fv2-dialog [data-fv2-new-category]{grid-template-columns:1fr}}

*{box-sizing:border-box}body{margin:0;padding:28px;background:var(--color-canvas);font-family:var(--font-family-sans);font-size:14px;color:var(--color-text)}button,input,select{font:inherit}button{cursor:pointer}.module-container{max-width:1450px;margin:auto}.toast{position:fixed;bottom:20px;right:20px;background:#183d2e;color:#fff;padding:12px 16px;border-radius:9px;display:none;z-index:100}.toast.visible{display:block}.fv2-dialog-form{margin:0}
@media(max-width:700px){body{padding:12px}}
</style>
<style>
.gain-modal{width:min(790px,calc(100vw - 24px))}.gain-modal .fv2-fields{max-height:65vh;overflow:auto}.gain-modal textarea{min-height:64px;border:1px solid var(--color-border-strong);border-radius:8px;padding:10px;font:inherit}.gain-modal .full{grid-column:1/-1}.gain-inline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;border-top:1px solid var(--color-border-soft);font-weight:700}.gain-inline small{font-weight:400;color:var(--color-text-muted)}.gain-extra[hidden]{display:none}.gain-item-row{display:grid;grid-template-columns:minmax(0,2fr) 70px 110px auto;gap:6px;margin:8px 0}.gain-payment-row{display:grid;grid-template-columns:135px minmax(80px,1fr) minmax(120px,1fr) minmax(120px,1fr) auto;gap:6px;margin:8px 0}.gain-payment-row input,.gain-payment-row select,.gain-item-row input{width:100%;min-width:0;min-height:38px;border:1px solid var(--color-border-strong);border-radius:8px;padding:7px;background:white}.gain-payment-row .gain-reason{grid-column:1/-1}.gain-summary{padding:12px;background:var(--color-brand-50);border-radius:8px;font-size:12px;line-height:1.7}.gain-error{color:var(--color-danger-700);font-weight:700;font-size:12px}.gain-form-footer{padding:0 24px 16px;display:flex;justify-content:flex-end}.gain-sale-form .fv2-fields{padding-bottom:12px}.gain-note{margin:10px 24px 20px;color:var(--color-text-muted);font-size:12px}.gain-actions{display:flex;gap:9px}.gain-pill{border-radius:99px;padding:5px 8px;font-size:11px;font-weight:700;white-space:nowrap;background:#eef3f1;color:#365f50}.gain-pill.ok{background:#e3f5e9;color:#19764d}.gain-pill.wait{background:#fff5dd;color:#896425}.gain-pill.partial{background:#fff2da;color:#9b641f}.gain-pill.bad{background:#faeceb;color:#a34f49}.gain-checkbox{display:flex!important;align-items:center;gap:9px}.gain-checkbox input{width:auto!important;min-height:0!important}@media(max-width:700px){.gain-payment-row{grid-template-columns:1fr 1fr}.gain-payment-row button{justify-self:start}.gain-item-row{grid-template-columns:1fr 60px 95px auto}.gain-modal .fv2-fields{max-height:65vh}}
</style>

<main class="module-container" id="module-root" aria-label="Módulo Ganhos"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<!-- ÚNICA DEPENDÊNCIA EXTERNA: mock compartilhado com os demais módulos -->
<script src="../../mock/mock.js"></script>
<script>
window.EnjoyMockReady.then(() => {
(() => {
'use strict';
const KEY='enjoy_resumo_movimentacoes_v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const cents=n=>Math.round(Number(n||0)*100);
const uid=()=>crypto?.randomUUID?.()||`m-${Date.now()}-${Math.random().toString(36).slice(2)}`;
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dateFmt=d=>/^\d{4}-\d\d-\d\d$/.test(d||'')?d.split('-').reverse().join('/'): '—';
const validDate=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'')&&!Number.isNaN(Date.parse(d+'T12:00:00Z'))&&new Date(d+'T12:00:00Z').toISOString().slice(0,10)===d;
const accounts=()=>window.EnjoyReceipts?.accounts?.()||[];
const accountName=id=>accounts().find(a=>a.id===id)?.name||'Não informada';
const methods=['Pix','Dinheiro','Cartão de débito','Cartão de crédito','Transferência','Boleto','Outro'];
const source=()=>window.EnjoyStore.read(KEY,[]);
const store=async data=>window.EnjoyStore.writeAsync(KEY,data);
const reservationList=()=>window.EnjoyOperationsData?.records?.(window.EnjoyOperationsData?.KEYS?.reservations)||[];
const state={tab:'reservations',query:'',account:'',period:'all',start:'',end:'',origin:'all',sort:'desc'};
const categoriesSeed=[{name:'Alimentos e bebidas',subs:['Bebidas','Alimentos']},{name:'Serviços',subs:['Lavanderia','Experiências']},{name:'Produtos',subs:['Souvenires']},{name:'Outras vendas',subs:[]}];
const CAT_KEY='enjoy-gains-categories-v3';
let categories;try{categories=JSON.parse(localStorage.getItem(CAT_KEY));if(!Array.isArray(categories))categories=categoriesSeed}catch{categories=categoriesSeed};
const saveCats=()=>{try{localStorage.setItem(CAT_KEY,JSON.stringify(categories))}catch{}};
const normalize=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const total=s=>cents(s.amount)/100;
const received=s=>(s.payments||[]).filter(p=>p.status!=='void').reduce((n,p)=>n+cents(p.value),0)/100;
const refunded=s=>(s.refunds||[]).reduce((n,p)=>n+cents(p.value),0)/100;
const due=s=>Math.max(0,(cents(total(s))-cents(received(s)))/100);
const status=s=>s.cancelled?'Cancelada':due(s)<.005?'Recebida':received(s)>0?'Parcial':'Pendente';
const getSales=()=>source().flatMap(env=>(env.categories||[]).filter(c=>c.mode==='sale'&&c.flow==='in').flatMap(cat=>(cat.entries||[]).map((entry,index)=>({entry,cat,env,index}))));
const reservationData=()=>source().flatMap(env=>(env.categories||[]).filter(c=>c.flow==='in'&&c.mode!=='sale').flatMap(cat=>(cat.entries||[]).map((entry,index)=>({entry,cat,env,index}))));
const getResItem=r=>{const id=r.cat.reservationId||r.entry.reservationId||'';const reservation=reservationList().find(x=>String(x.id)===String(id));const name=reservation?.name || String(r.entry.description||r.cat.name).replace(/^Booking\s*[—-]\s*/i,'');const origin=reservation?.channel==='Booking'||/booking/i.test(r.entry.description||'')?'Booking':'Direta';const gross=Number((r.entry.gross ?? r.entry.amount ?? 0));const commission=Number(r.entry.commission||0);return {...r,id,name,origin,gross,commission,net:Math.max(0,gross-commission),checkout:r.entry.checkout||reservation?.checkout||'',paid:!!r.entry.confirmed,receiptDate:r.entry.receiptDate||'',expected:r.entry.expected||nextBusinessMonth(r.entry.checkout)};};
function nextBusinessMonth(d){if(!validDate(d))return '';const [y,m]=d.split('-').map(Number);const t=new Date(y,m,1,12);while(t.getDay()===0||t.getDay()===6)t.setDate(t.getDate()+1);return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`}
function modal(title,content,actions=''){const d=document.createElement('dialog');d.className='fv2-dialog gain-modal';d.innerHTML=`<div class="fv2-dialog-form"><header><h2>${esc(title)}</h2><p>Enjoy Gestão · Protótipo financeiro</p></header>${content}<footer><button class="fv2-button" data-close type="button">Fechar</button>${actions}</footer></div>`;document.body.append(d);d.querySelector('[data-close]').onclick=()=>d.close();d.addEventListener('close',()=>d.remove(),{once:true});d.showModal();return d}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('visible');setTimeout(()=>el.classList.remove('visible'),2700)}
const field=(label,html)=>`<label>${label}${html}</label>`;
const input=(name,type,value='',extra='')=>`<input name="${name}" type="${type}" value="${esc(value)}" ${extra}>`;
const select=(name,opts,current='',extra='')=>`<select name="${name}" ${extra}>${opts.map(([v,t])=>`<option value="${esc(v)}" ${String(current)===String(v)?'selected':''}>${esc(t)}</option>`).join('')}</select>`;
const acctOptions=()=>[['','Selecione a conta'],...accounts().map(a=>[a.id,a.name])];
const methodsOptions=()=>[['','Selecione a forma'],...methods.map(a=>[a,a])];
function filteredReservations(){return reservationData().map(getResItem).filter(r=>{if(state.origin!=='all'&&r.origin!==state.origin)return false;if(state.account&&r.entry.accountId!==state.account)return false;if(!periodOk(r.entry.date))return false;return !state.query||normalize([r.name,r.entry.description,r.origin,r.id].join(' ')).includes(normalize(state.query))}).sort((a,b)=>state.sort==='desc'?b.entry.date.localeCompare(a.entry.date):a.entry.date.localeCompare(b.entry.date))}
function filteredSales(){return getSales().filter(r=>{const s=augment(r.entry);if(state.account&&!(s.payments||[]).some(p=>p.accountId===state.account))return false;if(!periodOk(s.date))return false;return !state.query||normalize([s.description,s.category,s.subcategory,s.guestName,...(s.items||[]).map(i=>i.name)].join(' ')).includes(normalize(state.query))}).sort((a,b)=>state.sort==='desc'?b.entry.date.localeCompare(a.entry.date):a.entry.date.localeCompare(b.entry.date))}
function periodOk(d){const t=today();if(state.period==='month'&&d.slice(0,7)!==t.slice(0,7))return false;if(state.period==='range'&&((state.start&&d<state.start)||(state.end&&d>state.end)))return false;return true}
function augment(s){return {...s,category:s.category||'Outras vendas',subcategory:s.subcategory||'',payments:Array.isArray(s.payments)?s.payments:((s.accountId&&s.method)?[{id:'legacy-'+s.id,date:s.date,value:s.amount,accountId:s.accountId,method:s.method}]:[]),refunds:s.refunds||[],items:s.items||[],history:s.history||[]}}
function filtersHtml(){return `<section class="fv2-filters"><label>Conta ${select('account',[['','Todas as contas'],...accounts().map(a=>[a.id,a.name])],state.account,'data-filter')}</label><label class="fv2-search">Buscar ${input('query','search',state.query,'data-filter placeholder="Descrição, hóspede, produto..."')}</label>${state.tab==='reservations'?`<label>Origem ${select('origin',[['all','Booking e diretas'],['Booking','Booking'],['Direta','Direta']],state.origin,'data-filter')}</label>`:''}<label>Período ${select('period',[['all','Todo o período'],['month','Este mês'],['range','Intervalo personalizado']],state.period,'data-filter')}</label>${state.period==='range'?field('De',input('start','date',state.start,'data-filter'))+field('Até',input('end','date',state.end,'data-filter')):''}<button class="fv2-button" data-action="clear">Limpar filtros</button></section>`}
function reservationsTable(){const rows=filteredReservations();const gross=rows.reduce((a,r)=>a+r.gross,0),net=rows.reduce((a,r)=>a+r.net,0),paid=rows.filter(r=>r.paid).reduce((a,r)=>a+r.net,0);return `<div class="fv2-cards"><article><small>Valor bruto das reservas</small><strong>${brl(gross)}</strong></article><article><small>Valor líquido previsto</small><strong>${brl(net)}</strong></article><article><small>Recebimento confirmado</small><strong class="fv2-in">${brl(paid)}</strong></article><article><small>Valor a conciliar</small><strong>${brl(Math.max(0,net-paid))}</strong></article></div><div class="fv2-table-heading"><div><h3>Recebimentos de reservas</h3><p>${rows.length} registros · valores espelhados das reservas (mock)</p></div><button class="fv2-button" data-action="csv">Exportar CSV</button></div><div class="fv2-scroll"><table class="fv2-table"><thead><tr><th><button class="fv2-sort" data-action="sort">Data ${state.sort==='desc'?'↓':'↑'}</button></th><th>Reserva / hóspede</th><th>Origem</th><th>Conta / forma</th><th>Repasse previsto</th><th class="fv2-money">Bruto</th><th class="fv2-money">Líquido</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${dateFmt(r.entry.date)}</td><td class="fv2-description"><strong>${esc(r.name)}</strong><small>${esc(r.id||'Reserva vinculada')}</small></td><td><span class="fv2-chip">${esc(r.origin)}</span></td><td>${esc(accountName(r.entry.accountId))}<small>${esc(r.entry.method||'Não informada')}</small></td><td>${r.origin==='Booking'?dateFmt(r.expected):'—'}${r.entry.receiptDate?`<small>Efetivo: ${dateFmt(r.receiptDate)}</small>`:''}</td><td class="fv2-money">${brl(r.gross)}</td><td class="fv2-money in">${brl(r.net)}</td><td><span class="gain-pill ${r.paid?'ok':'wait'}">${r.paid?'Confirmado':'Previsto'}</span></td><td><button class="fv2-text-button" data-action="reservation" data-env="${esc(r.env.id)}" data-cat="${esc(r.cat.id)}" data-id="${esc(r.entry.id)}">Editar reserva</button></td></tr>`).join('')||'<tr><td colspan="9" class="fv2-empty">Nenhuma reserva encontrada.</td></tr>'}</tbody></table></div><p class="gain-note">O repasse Booking é estimado para o primeiro dia útil do mês seguinte ao checkout. Feriados bancários exigem conferência. Dados demonstrativos.</p>`}
function salesTable(){const rows=filteredSales().map(r=>({...r,s:augment(r.entry)}));const active=rows.filter(x=>!x.s.cancelled);const saleTotal=active.reduce((a,r)=>a+total(r.s),0);const got=rows.reduce((a,r)=>a+received(r.s),0);const refund=rows.reduce((a,r)=>a+refunded(r.s),0);const pend=active.reduce((a,r)=>a+due(r.s),0);return `<div class="fv2-cards"><article><small>Total vendido (ativas)</small><strong>${brl(saleTotal)}</strong></article><article><small>Recebimentos brutos</small><strong class="fv2-in">${brl(got)}</strong></article><article><small>Devoluções</small><strong class="fv2-out">${brl(refund)}</strong></article><article><small>Saldo a receber</small><strong>${brl(pend)}</strong></article></div><div class="fv2-table-heading"><div><h3>Vendas de produtos e serviços</h3><p>${rows.length} registros · recebimentos independentes</p></div><div class="gain-actions"><button class="fv2-button" data-action="csv">Exportar CSV</button><button class="fv2-button primary" data-action="new">+ Nova venda</button></div></div><div class="fv2-scroll"><table class="fv2-table"><thead><tr><th><button class="fv2-sort" data-action="sort">Data ${state.sort==='desc'?'↓':'↑'}</button></th><th>Descrição / itens</th><th>Categoria / subcategoria</th><th>Conta / forma</th><th>Status</th><th class="fv2-money">Total</th><th class="fv2-money">Recebido</th><th class="fv2-money">Pendente</th><th>Ações</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${dateFmt(r.s.date)}</td><td class="fv2-description"><strong>${esc(r.s.description)}</strong><small>${r.s.items.length?`${r.s.items.length} item(ns)`:'Venda rápida'}${r.s.guestName?' · '+esc(r.s.guestName):''}</small></td><td>${esc(r.s.category)}${r.s.subcategory?`<small>${esc(r.s.subcategory)}</small>`:''}</td><td>${r.s.payments.length?esc(accountName(r.s.payments[0].accountId))+'<small>'+esc(r.s.payments[0].method||'')+(r.s.payments.length>1?' · +'+(r.s.payments.length-1):'')+'</small>':'<span class="fv2-muted">Sem recebimento</span>'}</td><td><span class="gain-pill ${r.s.cancelled?'bad':due(r.s)<=0?'ok':received(r.s)>0?'partial':'wait'}">${status(r.s)}</span></td><td class="fv2-money">${brl(r.s.amount)}</td><td class="fv2-money in">${brl(received(r.s)-refunded(r.s))}</td><td class="fv2-money">${brl(r.s.cancelled?0:due(r.s))}</td><td><button class="fv2-text-button" data-action="sale" data-env="${esc(r.env.id)}" data-cat="${esc(r.cat.id)}" data-id="${esc(r.entry.id)}">Visualizar / editar</button></td></tr>`).join('')||'<tr><td colspan="9" class="fv2-empty">Nenhuma venda encontrada.</td></tr>'}</tbody></table></div><p class="gain-note">Total, recebimentos e devoluções são informações distintas. Valores recebidos não duplicam o valor da venda.</p>`}
function render(){const root=$('module-root');root.innerHTML=`<section class="fv2-module"><div class="fv2-heading"><div><span>FINANCEIRO</span><h2>Ganhos</h2><p>Receitas de reservas para consulta; vendas para gestão direta.</p></div><span class="gain-pill ok">Protótipo offline</span></div><nav class="fv2-tabs"><button class="fv2-tab ${state.tab==='reservations'?'is-active':''}" data-action="tab" data-tab="reservations">Recebimentos de reservas</button><button class="fv2-tab ${state.tab==='sales'?'is-active':''}" data-action="tab" data-tab="sales">Vendas</button></nav>${filtersHtml()}${state.tab==='sales'?salesTable():reservationsTable()}</section>`}
function findRecord(b){const data=structuredClone(source());const env=data.find(x=>String(x.id)===b.dataset.env);const cat=env?.categories?.find(x=>String(x.id)===b.dataset.cat);const entry=cat?.entries?.find(x=>String(x.id)===b.dataset.id);return {data,env,cat,entry}}
function paymentMarkup(p,i){return `<div class="gain-payment-row"><input aria-label="Data do recebimento" data-pdate="${i}" type="date" value="${esc(p.date)}"><input aria-label="Valor do recebimento" data-pvalue="${i}" type="number" min="0.01" step="0.01" value="${esc(p.value)}">${select('payAccount',acctOptions(),p.accountId,`data-paccount="${i}" aria-label="Conta do recebimento"`)}${select('payMethod',methodsOptions(),p.method,`data-pmethod="${i}" aria-label="Forma do recebimento"`)}<button type="button" class="fv2-button" data-remove-pay="${i}">✕</button></div>`}
function refundMarkup(p,i){return `<div class="gain-payment-row"><input aria-label="Data da devolução" data-rdate="${i}" type="date" value="${esc(p.date)}"><input aria-label="Valor da devolução" data-rvalue="${i}" type="number" min="0.01" step="0.01" value="${esc(p.value)}">${select('refundAccount',acctOptions(),p.accountId,`data-raccount="${i}" aria-label="Conta de devolução"`)}${select('refundMethod',methodsOptions(),p.method,`data-rmethod="${i}" aria-label="Forma de devolução"`)}<button type="button" class="fv2-button" data-remove-refund="${i}">✕</button><input class="gain-reason" data-rreason="${i}" value="${esc(p.reason)}" placeholder="Motivo da devolução *" aria-label="Motivo da devolução"></div>`}
function itemMarkup(p,i){return `<div class="gain-item-row"><input data-item-name="${i}" placeholder="Produto ou serviço" value="${esc(p.name)}"><input type="number" data-item-qty="${i}" min="1" step="1" value="${esc(p.qty||1)}" aria-label="Quantidade"><input type="number" data-item-price="${i}" min="0.01" step="0.01" value="${esc(p.price)}" aria-label="Preço unitário"><button class="fv2-button" type="button" data-remove-item="${i}">✕</button></div>`}
function openSale(rec){let original=rec?.entry?augment(rec.entry):null;let draft=original?structuredClone(original):{id:uid(),date:today(),description:'',category:categories[0]?.name||'Outras vendas',subcategory:'',amount:'',guestName:'',reservationId:'',items:[],payments:[],refunds:[],history:[],notes:'',cancelled:false};const isEdit=!!original;const body=`<form class="gain-sale-form"><div class="fv2-fields">${field('Descrição da venda *',input('description','text',draft.description,'required maxlength="120"'))}${field('Data *',input('date','date',draft.date,'required'))}${field('Categoria *',select('category',[...categories.map(c=>[c.name,c.name]),['__new__','+ Nova categoria']],draft.category))}${field('Subcategoria (opcional)',select('subcategory',[],draft.subcategory))}<div class="gain-extra full" id="newCategoryBox" hidden>${field('Nome da categoria',input('newCategory','text'))}</div><div class="gain-extra full" id="newSubcategoryBox" hidden>${field('Nome da subcategoria',input('newSubcategory','text'))}</div>${field('Valor total da venda *',input('amount','number',draft.amount,'min="0.01" step="0.01" required'))}${field('Hóspede (opcional)',input('guestName','text',draft.guestName,'placeholder="Nome do hóspede"'))}${field('Reserva vinculada (opcional)',select('reservationId',[['','Sem vínculo'],...reservationList().map(r=>[r.id,`${r.name} (${r.id})`])],draft.reservationId))}<div class="full gain-inline"><span>Itens da venda <small>(opcionais)</small></span><button type="button" class="fv2-button" id="addSaleItem">+ Item</button></div><div class="full" id="saleItemList"></div><div class="full gain-inline"><span>Recebimentos <small>(independentes)</small></span><button type="button" class="fv2-button" id="addSalePayment">+ Recebimento</button></div><div class="full" id="salePaymentList"></div><div class="full gain-inline"><span>Devoluções / estornos</span><button type="button" class="fv2-button" id="addSaleRefund">+ Devolução</button></div><div class="full" id="saleRefundList"></div><label class="full">Observações<textarea name="notes" rows="2">${esc(draft.notes)}</textarea></label><div class="full gain-summary" id="saleSummary"></div><div class="full gain-error" id="saleError" role="alert"></div></div><div class="gain-form-footer"><button class="fv2-button primary" type="submit">Salvar venda</button></div></form>`;const d=modal(isEdit?'Detalhes / editar venda':'Nova venda',body, isEdit?'<button class="fv2-button" type="button" id="saleCancel">Cancelar venda</button><button class="fv2-button" type="button" id="saleDelete">Excluir</button>':'');const form=d.querySelector('form');const fld=name=>form.elements.namedItem(name);const err=t=>d.querySelector('#saleError').textContent=t;
function updateCategory(){const chosen=fld('category').value;d.querySelector('#newCategoryBox').hidden=chosen!=='__new__';const cat=categories.find(c=>c.name===chosen);const sub=fld('subcategory');const previous=sub.value;sub.innerHTML=select('sub',[['','Sem subcategoria'],...(cat?.subs||[]).map(s=>[s,s]),['__new__','+ Nova subcategoria']],previous).replace(/^<select[^>]+>|<\/select>$/g,'');if(draft.subcategory&&[...sub.options].some(o=>o.value===draft.subcategory))sub.value=draft.subcategory;d.querySelector('#newSubcategoryBox').hidden=sub.value!=='__new__'}
function snapshotInputs(){d.querySelectorAll('[data-item-name]').forEach((el,i)=>draft.items[i].name=el.value);d.querySelectorAll('[data-item-qty]').forEach((el,i)=>draft.items[i].qty=el.value);d.querySelectorAll('[data-item-price]').forEach((el,i)=>draft.items[i].price=el.value);d.querySelectorAll('[data-pdate]').forEach((el,i)=>draft.payments[i].date=el.value);d.querySelectorAll('[data-pvalue]').forEach((el,i)=>draft.payments[i].value=el.value);d.querySelectorAll('[data-paccount]').forEach((el,i)=>draft.payments[i].accountId=el.value);d.querySelectorAll('[data-pmethod]').forEach((el,i)=>draft.payments[i].method=el.value);d.querySelectorAll('[data-rdate]').forEach((el,i)=>draft.refunds[i].date=el.value);d.querySelectorAll('[data-rvalue]').forEach((el,i)=>draft.refunds[i].value=el.value);d.querySelectorAll('[data-raccount]').forEach((el,i)=>draft.refunds[i].accountId=el.value);d.querySelectorAll('[data-rmethod]').forEach((el,i)=>draft.refunds[i].method=el.value);d.querySelectorAll('[data-rreason]').forEach((el,i)=>draft.refunds[i].reason=el.value)}
function drawLists(){d.querySelector('#saleItemList').innerHTML=draft.items.map(itemMarkup).join('');d.querySelector('#salePaymentList').innerHTML=draft.payments.map(paymentMarkup).join('')||'<p class="gain-note">Nenhum recebimento: a venda ficará pendente.</p>';d.querySelector('#saleRefundList').innerHTML=draft.refunds.map(refundMarkup).join('')||'<p class="gain-note">Nenhuma devolução registrada.</p>';summary()}
function summary(){const receivedNow=draft.payments.reduce((a,p)=>a+Number(p.value||0),0),refundNow=draft.refunds.reduce((a,p)=>a+Number(p.value||0),0),v=Number(fld('amount').value||0);d.querySelector('#saleSummary').innerHTML=`Total: <b>${brl(v)}</b> · Recebido: <b>${brl(receivedNow)}</b> · Devolvido: <b>${brl(refundNow)}</b> · Pendente: <b>${brl(Math.max(0,v-receivedNow))}</b>`}
updateCategory();drawLists();fld('category').addEventListener('change',()=>{draft.subcategory='';updateCategory()});fld('subcategory').addEventListener('change',()=>d.querySelector('#newSubcategoryBox').hidden=fld('subcategory').value!=='__new__');fld('amount').addEventListener('input',summary);d.querySelector('#saleItemList').addEventListener('input',e=>{snapshotInputs();const itemTotal=draft.items.reduce((n,i)=>n+(Number(i.qty)||0)*(Number(i.price)||0),0);if(itemTotal>0)fld('amount').value=itemTotal.toFixed(2);summary()});for(const id of ['salePaymentList','saleRefundList'])d.querySelector('#'+id).addEventListener('input',()=>{snapshotInputs();summary()});d.querySelector('#addSaleItem').onclick=()=>{snapshotInputs();draft.items.push({name:'',qty:1,price:''});drawLists()};d.querySelector('#addSalePayment').onclick=()=>{snapshotInputs();draft.payments.push({id:uid(),date:today(),value:'',accountId:'',method:''});drawLists()};d.querySelector('#addSaleRefund').onclick=()=>{snapshotInputs();draft.refunds.push({id:uid(),date:today(),value:'',accountId:'',method:'',reason:''});drawLists()};d.addEventListener('click',e=>{const b=e.target.closest('[data-remove-item],[data-remove-pay],[data-remove-refund]');if(!b)return;snapshotInputs();if(b.dataset.removeItem!==undefined)draft.items.splice(+b.dataset.removeItem,1);if(b.dataset.removePay!==undefined)draft.payments.splice(+b.dataset.removePay,1);if(b.dataset.removeRefund!==undefined)draft.refunds.splice(+b.dataset.removeRefund,1);drawLists()});
function validate(){snapshotInputs();const v=Number(fld('amount').value);if(!fld('description').value.trim())throw Error('Informe a descrição.');if(!validDate(fld('date').value))throw Error('Informe uma data válida.');if(!Number.isFinite(v)||v<=0)throw Error('Informe valor total maior que zero.');let cat=fld('category').value;if(cat==='__new__'){cat=fld('newCategory').value.trim();if(!cat)throw Error('Informe a nova categoria.');if(categories.some(c=>normalize(c.name)===normalize(cat)))throw Error('A categoria já existe. Selecione-a.')}let sub=fld('subcategory').value;if(sub==='__new__'){sub=fld('newSubcategory').value.trim();if(!sub)throw Error('Informe a nova subcategoria.')}if(draft.items.some(i=>!i.name?.trim()||!(Number(i.qty)>0)||!Number.isInteger(Number(i.qty))||!(Number(i.price)>0)))throw Error('Verifique nome, quantidade e preço de cada item.');if(draft.items.length&&Math.abs(draft.items.reduce((n,i)=>n+cents(Number(i.qty)*Number(i.price)),0)-cents(v))>0)throw Error('A soma dos itens deve corresponder ao total da venda.');for(const p of [...draft.payments,...draft.refunds]){if(!validDate(p.date)||!(Number(p.value)>0)||!p.accountId||!p.method)throw Error('Verifique data, valor, conta e forma dos recebimentos/devoluções.')}if(draft.refunds.some(p=>!p.reason?.trim()))throw Error('Informe o motivo das devoluções.');const rec=draft.payments.reduce((n,p)=>n+cents(p.value),0),refund=draft.refunds.reduce((n,p)=>n+cents(p.value),0);if(rec>cents(v))throw Error('O recebido não pode ultrapassar o total vendido.');if(refund>rec)throw Error('A devolução não pode ultrapassar o valor recebido.');return {id:draft.id,date:fld('date').value,description:fld('description').value.trim(),category:cat,subcategory:sub,amount:v,guestName:fld('guestName').value.trim(),reservationId:fld('reservationId').value,items:draft.items.map(i=>({name:i.name.trim(),qty:Number(i.qty),price:Number(i.price)})),payments:draft.payments.map(p=>({...p,value:Number(p.value)})),refunds:draft.refunds.map(p=>({...p,value:Number(p.value)})),notes:fld('notes').value.trim(),cancelled:draft.cancelled}}
form.onsubmit=async e=>{e.preventDefault();err('');try{const updated=validate();const changedPayment=isEdit&&JSON.stringify({payments:original.payments,refunds:original.refunds})!==JSON.stringify({payments:updated.payments,refunds:updated.refunds});if(changedPayment&&!confirm('Você alterou recebimentos ou devoluções já registrados. Confirmar a correção financeira?'))return;const data=structuredClone(source());let env,cat,old;if(isEdit){env=data.find(e=>e.id===rec.env.id);cat=env?.categories.find(c=>c.id===rec.cat.id);old=cat?.entries.find(s=>s.id===rec.entry.id);if(!old)throw Error('Venda não encontrada.')}else{env=data.find(e=>(e.categories||[]).some(c=>c.mode==='sale'))||data.find(e=>normalize(e.name)==='vendas');if(!env){env={id:uid(),name:'Vendas',categories:[]};data.push(env)}cat=env.categories.find(c=>c.mode==='sale');if(!cat){cat={id:uid(),name:'Vendas avulsas',mode:'sale',flow:'in',classification:'revenue',entries:[],days:{}};env.categories.push(cat)}}if(fld('category').value==='__new__')categories.push({name:updated.category,subs:[]});if(fld('subcategory').value==='__new__'){const c=categories.find(c=>c.name===updated.category);if(c&&!c.subs.includes(updated.subcategory))c.subs.push(updated.subcategory)}saveCats();updated.history=[...(original?.history||[]),{date:new Date().toISOString(),action:isEdit?'Edição':'Cadastro',note:changedPayment?'Incluiu alteração financeira':''}];const saveEntry={...old,...updated,accountId:updated.payments[0]?.accountId||'',method:updated.payments[0]?.method||''};if(isEdit)cat.entries=cat.entries.map(x=>x.id===rec.entry.id?saveEntry:x);else cat.entries.push(saveEntry);await store(data);d.close();render();toast('Venda salva no mock.')}catch(ex){err(ex.message||'Erro ao salvar.')}};
if(isEdit){d.querySelector('#saleDelete').onclick=async()=>{if(original.payments.length||original.refunds.length)return err('Vendas com movimentações registradas não podem ser excluídas. Use Cancelar.');if(!confirm('Excluir esta venda sem pagamentos?'))return;const data=structuredClone(source());const cat=data.find(x=>x.id===rec.env.id)?.categories.find(x=>x.id===rec.cat.id);cat.entries=cat.entries.filter(x=>x.id!==rec.entry.id);await store(data);d.close();render();toast('Venda excluída.')};d.querySelector('#saleCancel').onclick=async()=>{if(!confirm('Cancelar esta venda e preservar todo o histórico dos pagamentos?'))return;const data=structuredClone(source());const item=data.find(x=>x.id===rec.env.id)?.categories.find(x=>x.id===rec.cat.id)?.entries.find(x=>x.id===rec.entry.id);item.cancelled=true;item.history=[...(item.history||[]),{date:new Date().toISOString(),action:'Cancelamento'}];await store(data);d.close();render();toast('Venda cancelada; histórico preservado.')};}}
function openReservation(rec){if(!rec?.entry)return;const r=getResItem(rec);const body=`<form id="gain-reservation-form"><div class="fv2-fields">${field('Hóspede',input('guest','text',r.name,'readonly'))}${field('Origem',input('origin','text',r.origin,'readonly'))}${field('Código de reserva',input('id','text',r.id,'readonly'))}${field('Data da reserva',input('date','date',r.entry.date,'readonly'))}${field('Checkout *',input('checkout','date',r.checkout||r.entry.date,'required'))}${field('Valor bruto *',input('gross','number',r.gross,'min="0.01" step="0.01" required'))}${field('Comissão Booking',input('commission','number',r.commission,'min="0" step="0.01"'))}${field('Conta de destino',select('accountId',acctOptions(),r.entry.accountId))}${field('Forma',select('method',methodsOptions(),r.entry.method))}${field('Repasse previsto',input('expected','date',r.expected,'readonly'))}${field('Data efetiva do recebimento',input('receiptDate','date',r.receiptDate))}<label class="gain-checkbox"><input name="confirmed" type="checkbox" ${r.paid?'checked':''}> Recebimento confirmado</label><div class="full gain-note">Simulação do modal compartilhado de Reservas. Este laboratório não inclui o PMS real. Alterações atualizam o lançamento da reserva no mock compartilhado; Ganhos o relê automaticamente.</div><div class="full gain-error" id="reservationError" role="alert"></div></div><div class="gain-form-footer"><button class="fv2-button primary" type="submit">Salvar alteração da reserva</button></div></form>`;const d=modal('Editar reserva vinculada',body);const form=d.querySelector('form');const fld=n=>form.elements.namedItem(n);const updateExpected=()=>{fld('expected').value=nextBusinessMonth(fld('checkout').value)};fld('checkout').addEventListener('change',updateExpected);if(r.origin==='Direta'){fld('commission').value=0;fld('commission').disabled=true}form.onsubmit=async e=>{e.preventDefault();const gross=Number(fld('gross').value),commission=Number(fld('commission').value);const error=d.querySelector('#reservationError');error.textContent='';if(!validDate(fld('checkout').value)||!(gross>0)||commission<0||commission>gross){error.textContent='Revise checkout, valor e comissão.';return}if(!confirm('Confirmar alteração nos dados da reserva de origem (mock)?'))return;const data=structuredClone(source());const entry=data.find(x=>x.id===rec.env.id)?.categories.find(x=>x.id===rec.cat.id)?.entries.find(x=>x.id===rec.entry.id);if(!entry){error.textContent='Reserva não encontrada no mock.';return}Object.assign(entry,{gross,amount:gross-commission,commission,checkout:fld('checkout').value,expected:fld('expected').value,receiptDate:fld('receiptDate').value,confirmed:fld('confirmed').checked,accountId:fld('accountId').value,method:fld('method').value});await store(data);d.close();render();toast('Reserva de origem atualizada no mock.')}}
function csv(){const rows=state.tab==='sales'?filteredSales().map(({entry})=>{const s=augment(entry);return [s.date,s.description,s.category,s.subcategory,s.amount,received(s),refunded(s),status(s)]}):filteredReservations().map(r=>[r.entry.date,r.name,r.origin,r.gross,r.commission,r.net,r.expected,r.paid?'Confirmado':'Previsto']);const headers=state.tab==='sales'?['Data','Descrição','Categoria','Subcategoria','Total','Recebido','Devolvido','Status']:['Data','Hóspede','Origem','Bruto','Comissão','Líquido','Repasse previsto','Status'];const quote=x=>'"'+String(x??'').replace(/^[=+@\-\t\r]/,m=>"'"+m).replaceAll('"','""')+'"';const blob=new Blob(['\ufeff'+[headers,...rows].map(row=>row.map(quote).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`enjoy-ganhos-${state.tab}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('module-root').addEventListener('change',e=>{const f=e.target.closest('[data-filter]');if(!f)return;state[f.name]=f.value;render()});$('module-root').addEventListener('input',e=>{if(e.target.name==='query'){state.query=e.target.value;const p=e.target.selectionStart;render();const i=$('module-root').querySelector('[name=query]');i.focus();i.setSelectionRange(p,p)}});$('module-root').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;if(action==='tab'){state.tab=b.dataset.tab;state.query='';state.account='';state.period='all';state.start='';state.end='';render()}if(action==='clear'){Object.assign(state,{query:'',account:'',period:'all',start:'',end:'',origin:'all'});render()}if(action==='sort'){state.sort=state.sort==='desc'?'asc':'desc';render()}if(action==='csv')csv();if(action==='new')openSale(null);if(action==='sale')openSale(findRecord(b));if(action==='reservation')openReservation(findRecord(b))});
window.EnjoyStore.subscribe(KEY,render);render();
})();

});
