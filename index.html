<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enjoy Gestão · Laboratório Financeiro</title>
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/shell.css">
  <link rel="stylesheet" href="styles/frame.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="avatar">E</span><div class="brand-text"><strong>Enjoy Gestão</strong><small>Enjoy Hostel</small></div><button id="collapse" aria-label="Recolher ou expandir menu" title="Recolher ou expandir menu">‹</button></div>
    <div class="nav-scroll"><p class="section-label">Financeiro</p>
      <nav aria-label="Menu financeiro">
        <button class="nav-item active" data-page="overview"><span class="symbol">▦</span><span class="nav-label">Visão geral</span></button>
        <button class="nav-item" data-page="gains"><span class="symbol">↙</span><span class="nav-label">Ganhos</span></button>
        <button class="nav-item" data-page="expenses"><span class="symbol">↗</span><span class="nav-label">Despesas</span></button>
        <button class="nav-item" data-page="investments"><span class="symbol">◈</span><span class="nav-label">Investimentos</span></button>
        <button class="nav-item" data-page="decisions"><span class="symbol">▤</span><span class="nav-label">Decisões</span></button>
      </nav>
      <p class="section-label secondary-heading">Hospedagem</p><div class="inactive"><span>▦</span><span class="nav-label">Reservas e ocupação</span></div><div class="inactive"><span>▤</span><span class="nav-label">Quartos e leitos</span></div><div class="inactive"><span>✦</span><span class="nav-label">Limpeza e preparação</span></div>
      <p class="section-label secondary-heading">Operação</p><div class="inactive"><span>⚙</span><span class="nav-label">Configurações</span></div>
    </div>
    <div class="sidebar-bottom"><strong class="nav-label">Enjoy Hostel</strong><small class="nav-label">Laboratório local · dados mock</small></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><button id="mobile-menu" aria-label="Abrir menu">☰</button><div><h1 id="page-title">Visão geral</h1><p id="page-description">Resumo de ganhos, despesas e investimentos com filtros cumulativos.</p></div><div class="status"><span class="dot"></span> Laboratório · Mock local</div></header>
    <main class="content"><iframe id="module-frame" title="Módulo financeiro" src="modulos/visao-geral/index.html" loading="eager"></iframe></main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="mock/mock.js"></script>
  <script>
  (() => {
    const pages = {
      overview: ['Visão geral', 'Resumo de ganhos, despesas e investimentos com filtros cumulativos.', 'visao-geral'],
      gains: ['Ganhos', 'Consulte as entradas registradas e recebimentos de reservas.', 'ganhos'],
      expenses: ['Despesas', 'Controle custos e despesas na tabela geral.', 'despesas'],
      investments: ['Investimentos', 'Acompanhe investimentos sem misturar com o saldo operacional.', 'investimentos'],
      decisions: ['Decisões', 'Registro das definições dos quatro módulos financeiros.', 'decisoes']
    };
    const frame = document.getElementById('module-frame');
    const sidebar = document.getElementById('sidebar');
    function open(page) {
      if (!pages[page]) page='overview';
      const [title, description, folder] = pages[page];
      document.getElementById('page-title').textContent = title;
      document.getElementById('page-description').textContent = description;
      document.title = title + ' · Enjoy Gestão Financeiro';
      document.querySelectorAll('[data-page]').forEach(b => {
        const active=b.dataset.page===page;
        b.classList.toggle('active',active);
        b.setAttribute('aria-current',active?'page':'false');
      });
      const url = 'modulos/'+folder+'/index.html';
      if (frame.getAttribute('src')!==url) frame.src=url;
      frame.title='Financeiro · '+title;
      sidebar.classList.remove('mobile-open');
      if (location.hash !== '#'+page) history.replaceState(null,'','#'+page);
    }
    document.querySelectorAll('[data-page]').forEach(button => button.addEventListener('click', () => open(button.dataset.page)));
    document.getElementById('collapse').addEventListener('click', () => {
      const collapsed=sidebar.classList.toggle('collapsed');
      document.getElementById('collapse').textContent=collapsed?'›':'‹';
      document.getElementById('collapse').setAttribute('aria-expanded',String(!collapsed));
    });
    document.getElementById('mobile-menu').addEventListener('click',()=>sidebar.classList.toggle('mobile-open'));
    window.addEventListener('hashchange',()=>open(location.hash.slice(1)));
    open(location.hash.slice(1)||'overview');
  })();
  </script>
</body></html>
