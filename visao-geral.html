<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financeiro · Visão geral</title><style>
:root{--color-white:#fff;--color-border:#d7e4de;--color-border-soft:#e8f0ec;--color-border-strong:#b8ccc2;--color-surface-subtle:#f5f8f6;--color-text:#18372e;--color-text-strong:#102d24;--color-text-secondary:#4e6c61;--color-text-muted:#71897f;--color-text-faint:#8ba097;--color-brand-50:#eaf5ef;--color-brand-700:#17624d;--color-brand-900:#103d30;--color-success-100:#e4f6eb;--color-success-700:#16724e;--color-danger-100:#fff0ed;--color-danger-700:#b34b43;--radius-md:8px;--radius-lg:11px;--radius-xl:14px;--shadow-card:0 8px 28px #173c2e0d;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#f3f7f4;color:var(--color-text);padding:28px}.fv2-module{background:var(--color-white);border:1px solid var(--color-border);border-radius:var(--radius-xl);box-shadow:var(--shadow-card);overflow:hidden}.fv2-heading{display:flex;justify-content:space-between;gap:20px;padding:22px 24px 18px;border-bottom:1px solid var(--color-border-soft)}.fv2-heading h2{font-size:26px;margin:5px 0}.fv2-heading p{color:var(--color-text-muted);margin:0;font-size:14px}.fv2-heading span{font-size:11px;letter-spacing:.12em;font-weight:800;color:var(--color-brand-700)}.fv2-filters{display:flex;align-items:end;flex-wrap:wrap;gap:12px;padding:18px 24px;background:var(--color-surface-subtle);border-bottom:1px solid var(--color-border)}.fv2-filters label{display:grid;gap:6px;font-weight:700;font-size:12px;color:var(--color-text-secondary)}.fv2-filters select,.fv2-filters input{height:40px;min-width:155px;padding:8px 12px;border:1px solid var(--color-border-strong);border-radius:var(--radius-md);background:#fff;color:var(--color-text)}.fv2-search{flex:1}.fv2-search input{width:100%}.fv2-button{border:1px solid var(--color-border);min-height:38px;border-radius:var(--radius-md);padding:8px 12px;font-size:12px;font-weight:700;background:#fff;color:var(--color-brand-900);cursor:pointer}.fv2-cards{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--color-border)}.fv2-cards article{display:grid;gap:8px;padding:17px 20px;border-right:1px solid var(--color-border-soft);background:var(--color-surface-subtle)}.fv2-cards small{font-size:12px;color:var(--color-text-muted)}.fv2-cards strong{font-size:21px;color:var(--color-text-strong)}.fv2-in{color:var(--color-success-700)!important}.fv2-out{color:var(--color-danger-700)!important}.fv2-table-heading{padding:18px 24px 13px;display:flex;justify-content:space-between;align-items:center}.fv2-table-heading h3{margin:0;font-size:16px}.fv2-table-heading p{margin:3px 0;color:var(--color-text-muted);font-size:12px}.fv2-scroll{overflow:auto;margin:0 24px 24px;border:1px solid var(--color-border);border-radius:var(--radius-lg)}table{width:100%;min-width:930px;border-collapse:collapse;font-size:13px}th{background:var(--color-surface-subtle);color:var(--color-text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.055em;padding:12px 11px;text-align:left}td{padding:13px 11px;border-top:1px solid var(--color-border-soft)}td small{display:block;margin-top:4px;color:var(--color-text-faint);font-size:11px}.chip,.flow{display:inline-block;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700}.chip{border:1px solid var(--color-border);background:var(--color-brand-50);color:var(--color-brand-900)}.flow{background:var(--color-success-100);color:var(--color-success-700)}.money{text-align:right;font-weight:700}.sort{border:0;background:none;color:inherit;font:inherit;font-weight:800;cursor:pointer}@media(max-width:700px){body{padding:12px}.fv2-heading{padding:16px;flex-direction:column}.fv2-filters{padding:14px 16px}.fv2-cards{grid-template-columns:repeat(2,1fr)}.fv2-scroll{margin:0 12px 16px}}
</style></head><body><main class="fv2-module"><header class="fv2-heading"><div><span>FINANCEIRO</span><h2>Visão geral</h2><p>Todos os lançamentos financeiros por data.</p></div></header><div class="fv2-filters"><label>Conta<select><option>Todas as contas</option><option>Banco Inter</option><option>Caixa</option></select></label><label>Ambiente<select><option>Todos os ambientes</option><option>Hospedagem</option><option>Operação</option></select></label><label class="fv2-search">Buscar<input id="q" placeholder="Descrição ou categoria"></label><label>Período<select><option>Todas as datas</option><option>Mês atual</option></select></label><button class="fv2-button" id="clear">Limpar filtros</button></div><div class="fv2-cards"><article><small>Saldo operacional</small><strong class="fv2-in" id="balance"></strong><span>Ganhos menos despesas</span></article><article><small>Ganhos</small><strong class="fv2-in" id="gain"></strong></article><article><small>Despesas</small><strong class="fv2-out" id="expense"></strong></article><article><small>Investimentos</small><strong id="invest"></strong></article></div><div class="fv2-table-heading"><div><h3>Tabela geral</h3><p id="count"></p></div><button class="fv2-button" id="export">Exportar CSV</button></div><div class="fv2-scroll"><table><thead><tr><th><button class="sort" id="sort">Data ↑</button></th><th>Descrição</th><th>Classificação</th><th>Ambiente / categoria</th><th>Conta / forma</th><th>Tipo</th><th class="money">Entrada</th><th class="money">Saída</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>
const d=[['2026-11-03','Reserva — Helena',1280,'Hospedagem','Reserva','Banco Inter','Cartão','in','revenue'],['2026-11-04','Venda de bebidas',96,'Vendas','Vendas avulsas','Caixa','Dinheiro','in','revenue'],['2026-11-05','Energia elétrica',418.3,'Hospedagem','Utilidades','Banco Inter','Débito','out','expense'],['2026-11-07','Freezer horizontal',1890,'Cozinha','Equipamentos','Banco Inter','Pix','out','investment']];let down=false;const money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function render(){let x=d.filter(r=>r.join(' ').toLowerCase().includes(q.value.toLowerCase()));x.sort((a,b)=>down?b[0].localeCompare(a[0]):a[0].localeCompare(b[0]));rows.innerHTML=x.map(r=>`<tr><td>${r[0].split('-').reverse().join('/')}</td><td><b>${r[1]}</b></td><td>${r[8]==='investment'?'Investimento':r[8]==='expense'?'Despesa':'Ganho'}</td><td><span class="chip">${r[3]}</span><small>${r[4]}</small></td><td><span class="chip">${r[5]}</span><small>${r[6]}</small></td><td><span class="flow">${r[7]==='in'?'Entrada':'Saída'}</span></td><td class="money fv2-in">${r[7]==='in'?money(r[2]):'—'}</td><td class="money fv2-out">${r[7]==='out'?money(r[2]):'—'}</td></tr>`).join('');count.textContent=`${x.length} lançamentos · ${down?'data decrescente':'data crescente'}`;let g=d.filter(r=>r[7]==='in').reduce((s,r)=>s+r[2],0),e=d.filter(r=>r[8]==='expense').reduce((s,r)=>s+r[2],0),i=d.filter(r=>r[8]==='investment').reduce((s,r)=>s+r[2],0);gain.textContent=money(g);expense.textContent=money(e);invest.textContent=money(i);balance.textContent=money(g-e)}q.oninput=render;sort.onclick=()=>{down=!down;sort.textContent=`Data ${down?'↓':'↑'}`;render()};clear.onclick=()=>{q.value='';render()};export.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['data;descricao;valor\n'+d.map(r=>`${r[0]};${r[1]};${r[2]}`).join('\n')]));a.download='financeiro.csv';a.click()};render();
</script></body></html>
