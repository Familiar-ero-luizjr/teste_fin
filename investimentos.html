<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financeiro · Investimentos</title><style>:root{--w:#fff;--b:#d7e4de;--s:#f5f8f6;--t:#18372e;--m:#71897f;--g:#17624d;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;padding:28px;background:#f3f7f4;color:var(--t)}main{background:#fff;border:1px solid var(--b);border-radius:14px;overflow:hidden;box-shadow:0 8px 28px #173c2e0d}header{display:flex;justify-content:space-between;padding:22px 24px 18px;border-bottom:1px solid var(--b)}header span{font-size:11px;letter-spacing:.12em;font-weight:800;color:var(--g)}h2{font-size:26px;margin:5px 0}p{margin:0;color:var(--m);font-size:14px}.button{border:1px solid var(--b);min-height:38px;border-radius:8px;padding:8px 12px;background:#fff;color:#103d30;font-weight:700;cursor:pointer}.primary{background:var(--g);color:#fff;border-color:var(--g)}.filters{display:flex;gap:12px;align-items:end;flex-wrap:wrap;padding:18px 24px;background:var(--s);border-bottom:1px solid var(--b)}label{display:grid;gap:5px;font-size:12px;font-weight:700;color:#4e6c61}input,select{height:40px;min-width:155px;padding:8px;border:1px solid #b8ccc2;border-radius:8px;background:#fff}.search{flex:1}.search input{width:100%}.head{padding:18px 24px 13px;display:flex;justify-content:space-between}.head h3{font-size:16px;margin:0}.head p{font-size:12px}.scroll{overflow:auto;margin:0 24px 24px;border:1px solid var(--b);border-radius:11px}table{width:100%;min-width:850px;border-collapse:collapse;font-size:13px}th{padding:12px;background:var(--s);font-size:11px;text-align:left;text-transform:uppercase;color:var(--m)}td{padding:13px 12px;border-top:1px solid #e8f0ec}small{display:block;color:#8ba097}.chip{display:inline-block;border-radius:99px;padding:4px 8px;background:#edf2fb;color:#406697;font-size:11px;font-weight:700}.money{text-align:right;color:#b34b43;font-weight:800}.edit{border:0;background:none;color:var(--g);font-weight:700;text-decoration:underline;cursor:pointer}dialog{border:0;border-radius:14px;width:min(540px,94vw);box-shadow:0 20px 65px #0003}dialog::backdrop{background:#12261c95}form{padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}form h2,form p,menu{grid-column:1/-1}menu{margin:0;padding:0;display:flex;justify-content:flex-end;gap:8px}@media(max-width:700px){body{padding:12px}header{flex-direction:column}.filters{padding:14px}.scroll{margin:0 12px 16px}form{grid-template-columns:1fr}}</style></head><body><main><header><div><span>FINANCEIRO</span><h2>Investimentos</h2><p>Desembolsos classificados como investimento.</p></div><button class="button primary" id="new">+ Registrar investimento</button></header><div class="filters"><label class="search">Buscar<input id="q" placeholder="Descrição ou ambiente"></label><label>Conta<select><option>Todas as contas</option><option>Banco Inter</option><option>Caixa</option></select></label><label>Período<select><option>Todas as datas</option><option>Mês atual</option></select></label><button class="button" id="clear">Limpar filtros</button></div><div class="head"><div><h3>Tabela geral</h3><p id="count"></p></div><button class="button">Exportar CSV</button></div><div class="scroll"><table><thead><tr><th>Data</th><th>Descrição</th><th>Classificação</th><th>Ambiente / categoria</th><th>Conta / forma</th><th>Tipo</th><th class="money">Saída</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div></main><dialog id="modal"><form method="dialog"><h2>Registrar investimento</h2><p>O investimento é registrado separadamente e não reduz o saldo operacional.</p><label>Data<input name="date" type="date" value="2026-11-05"></label><label>Valor (R$)<input name="value" type="number" min=".01" step=".01" required></label><label>Descrição<input name="desc" required></label><label>Ambiente<input name="env" value="Hospedagem"></label><label>Conta<select name="account"><option>Banco Inter</option><option>Caixa</option></select></label><menu><button class="button">Cancelar</button><button class="button primary" value="save">Salvar mock</button></menu></form></dialog><script>let a=[['2026-11-02','Freezer horizontal',1890,'Cozinha','Equipamentos','Banco Inter','Pix'],['2026-11-07','Jogo de enxoval',640,'Hospedagem','Enxoval','Banco Inter','Cartão']];const money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function render(){let x=a.filter(r=>r.join(' ').toLowerCase().includes(q.value.toLowerCase()));rows.innerHTML=x.map((r,i)=>`<tr><td>${r[0].split('-').reverse().join('/')}</td><td><b>${r[1]}</b></td><td>Investimento</td><td>${r[3]}<small>${r[4]}</small></td><td>${r[5]}<small>${r[6]}</small></td><td><span class="chip">Saída</span></td><td class="money">${money(r[2])}</td><td><button class="edit" onclick="edit(${i})">Editar</button></td></tr>`).join('');count.textContent=`${x.length} lançamentos`};q.oninput=render;clear.onclick=()=>{q.value='';render()};new.onclick=()=>modal.showModal();modal.addEventListener('close',()=>{if(modal.returnValue==='save'){let f=new FormData(modal.querySelector('form'));a.push([f.get('date'),f.get('desc'),Number(f.get('value')),f.get('env'),'Investimento',f.get('account'),'Pix']);render()}});function edit(i){let v=prompt('Novo valor',a[i][2]);if(v){a[i][2]=Number(v);render()}}render();</script></body></html>
